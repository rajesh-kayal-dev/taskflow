apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.docker.internal"

      containers:
        - name: auth-service
          image: taskflow-auth-service:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4001
              name: http

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "4001"

            - name: FRONTEND_URL
              value: "http://localhost:5173"

            - name: COOKIE_NAME
              value: "refreshToken"

            - name: COOKIE_MAX_AGE
              value: "604800000"

            - name: COOKIE_SECURE
              value: "false"

          envFrom:
            - secretRef:
                name: auth-service-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 20
