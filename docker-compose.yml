services:
  postgres:
    image: postgres:latest
    container_name: taskflow-postgres-compose
    restart: unless-stopped

    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
      POSTGRES_DB: taskflow_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
